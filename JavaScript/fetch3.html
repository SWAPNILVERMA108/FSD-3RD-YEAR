<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>

    <style>
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            font-size: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>S.N.</th>
                <th>Title</th>
                <th>Image</th>
                <th>Price</th>
                <th>Category</th>
            </tr>
        </thead>

        <tbody id="data">

        </tbody>
    </table>

    <script>
        const ele = document.getElementById("data");
        const URL = "https://dummyjson.com/products";

        async function loadProduct() {
            try {
                // Fetch data
                const res = await fetch(URL);

                // Convert response to JSON
                const data = await res.json();

                console.log(data);

                let row = "";

                data.products.forEach((product, index) => {
                    row += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${product.title}</td>
                            <td>
                                <img src="${product.images[0]}" alt="${product.title}">
                            </td>
                            <td>$${product.price}</td>
                            <td>${product.category}</td>
                        </tr>
                    `;
                });

                ele.innerHTML = row;

            } catch (err) {
                console.error("Error:", err);

                ele.innerHTML = `
                    <tr>
                        <td colspan="5">Network Error</td>
                    </tr>
                `;
            }
        }

        loadProduct();
    </script>

</body>
</html>
