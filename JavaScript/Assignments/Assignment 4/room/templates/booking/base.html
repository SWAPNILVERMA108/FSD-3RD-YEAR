{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusBook{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'booking/style.css' %}">
  <link rel="stylesheet" href="{% static 'booking/classroom.css' %}">
</head>
<body>
  <header class="navbar navbar-expand border-bottom bg-white py-3">
    <div class="container"><a href="{% url 'booking:home' %}" class="navbar-brand brand">Campus<span>Book</span></a><span class="navbar-text small text-secondary">College spaces, simply reserved.</span></div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="border-top text-center text-secondary small py-4 mt-5">CampusBook · College classroom reservations</footer>
</body>
</html>
